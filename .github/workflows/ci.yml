name: Continuous Integration
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
  workflow_call:
jobs:
  identity:
    name: DevBoard identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Verify DevBoard identity
        run: |
          node --test tests/devboard-identity.test.mjs
          node scripts/check-devboard-identity.mjs
  github-auth-tests:
    name: Focused regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run focused regression tests
        run: dotnet test tests/DevBoard.Tests/DevBoard.Tests.csproj -c Release --filter "FullyQualifiedName~GitAuthenticationTests|FullyQualifiedName~GitHubAccountBindingTests|FullyQualifiedName~AIRouterToggleTests|FullyQualifiedName~AIRouterTests|FullyQualifiedName~AIRouterProviderDiagnosticTests|FullyQualifiedName~OpenAICompatibleProviderTests|FullyQualifiedName~PullRequestRemoteTests|FullyQualifiedName~PullRequestCommitRangeTests|FullyQualifiedName~RoslynUiResponsivenessTests|FullyQualifiedName~RoslynManualInitializationTests|FullyQualifiedName~DevSpaceCodeLanguageResolverTests"
  build:
    name: Build
    uses: ./.github/workflows/build.yml
  version:
    name: Prepare version string
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Output version string
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
  package:
    needs: [build, version]
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
