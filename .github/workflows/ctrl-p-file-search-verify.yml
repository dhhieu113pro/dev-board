name: Verify Ctrl+P File Search

on:
  push:
    branches:
      - verify/ctrl-p-file-search
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet format src/SourceGit.csproj --verify-no-changes
      - run: dotnet build src/SourceGit.csproj -c Release
