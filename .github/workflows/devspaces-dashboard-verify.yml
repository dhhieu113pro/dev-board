name: DevSpaces Dashboard Verify

on:
  push:
    branches:
      - feat/devspaces-dashboard-v1
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SourceGit.slnx
      - name: Tests
        run: dotnet test tests/SourceGit.Tests/SourceGit.Tests.csproj -c Release --no-restore
      - name: Build
        run: dotnet build src/SourceGit.csproj -c Release --no-restore
      - name: Format
        run: dotnet format src/SourceGit.csproj --verify-no-changes --no-restore
