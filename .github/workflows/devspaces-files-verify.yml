name: Verify DevSpaces Files

on:
  push:
    branches: [verify/devspaces-files-explorer]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Format check
        run: dotnet format --verify-no-changes src/SourceGit.csproj

      - name: Build
        run: dotnet build src/SourceGit.csproj -c Release
